<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Validation</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;

        }

        .login-box {
            border: 2px solid #d55454;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background-color: rgb(156, 65, 94);
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>

        <label>Username:</label><br>
        <input type="text" id="username" placeholder="enter Username"><br><br>

        <label>Password:</label><br>
        <input type="password" id="password" placeholder="enter your password "><br><br>

        <button onclick="validateLogin()">Submit</button>
    </div>

    <script>
        function validateLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;


            const usernameValid =
                /^[A-Z]/.test(username) && username.toLowerCase().includes("student");


            const passwordValid =
                password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[a-z]/.test(password) &&
                /[0-9]/.test(password) &&
                /[^A-Za-z0-9]/.test(password);


            if (usernameValid && passwordValid) {
                alert("Successful! Welcome.");
            } else {
                alert("Failed! Please fix the invalid fields above.");
            }
        }
    </script>
</body>

</html>
